name: Validate and Manually Release HF Ferramentas
on:
  push:
    branches: [main, 'codex/validacao-portal-*']
  pull_request:
  workflow_dispatch:
    inputs:
      public_preview:
        description: 'Publicar previa autorizada sem anuncios; homologacao final online'
        type: boolean
        default: false
      index_tools:
        description: 'Indexar somente home e sete ferramentas, com autorizacao especifica'
        type: boolean
        default: false
      preview_commit:
        description: 'Commit exato conferido para previa publica'
        type: string
        default: ''
      preview_sha256:
        description: 'SHA256 do pacote de previa publica conferido localmente'
        type: string
        default: ''
      release:
        description: 'Publicar somente com comprovacao final aprovada'
        type: boolean
        default: false
      evidence:
        description: 'Recibo JSON assinado pelo gate local completo, sem backups privados'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/verify-ci-plan.mjs
      - run: npm run build
      - run: npm run verify:public
      - run: npm run verify:reproducible
      - run: node scripts/build-public.mjs --public-preview
      - run: node scripts/verify-public.mjs --public-preview
      - run: node scripts/verify-reproducible.mjs --public-preview
      - run: node scripts/build-public.mjs --public-preview --indexed-tools
      - run: node scripts/verify-public.mjs --public-preview --indexed-tools
      - run: node scripts/verify-reproducible.mjs --public-preview --indexed-tools
  deploy-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.public_preview == true && inputs.release != true && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Construir Escopo Autorizado
        env:
          PREVIEW_INDEX_TOOLS: ${{ inputs.index_tools }}
        run: |
          if [ "$PREVIEW_INDEX_TOOLS" = "true" ]; then
            node scripts/build-public.mjs --public-preview --indexed-tools
          else
            node scripts/build-public.mjs --public-preview
          fi
      - name: Conferir Autorizacao e Pacote da Previa
        env:
          PREVIEW_APPROVED: ${{ inputs.public_preview }}
          PREVIEW_INDEX_TOOLS: ${{ inputs.index_tools }}
          PREVIEW_COMMIT: ${{ inputs.preview_commit }}
          PREVIEW_SHA256: ${{ inputs.preview_sha256 }}
        run: node scripts/verify-preview-release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-public-preview
      - name: Publicar Previa
        id: deployment
        uses: actions/deploy-pages@v5
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.release == true && inputs.public_preview != true && inputs.index_tools != true && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Autorizar Somente com Gate Local Assinado
        env:
          RELEASE_EVIDENCE: ${{ inputs.evidence }}
        run: node scripts/verify-release-attestation.mjs --authorization-only
      - run: node scripts/build-public.mjs --production
      - run: node scripts/verify-public.mjs --production
      - name: Gate Obrigatorio da Etapa 10
        env:
          RELEASE_EVIDENCE: ${{ inputs.evidence }}
        run: node scripts/verify-release-attestation.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
