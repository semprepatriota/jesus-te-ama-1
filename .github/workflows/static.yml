name: Validate and Manually Release HF Ferramentas
on:
  push:
    branches: [main, 'codex/validacao-portal-*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publicar somente com comprovacao final aprovada'
        type: boolean
        default: false
      evidence:
        description: 'Recibo JSON assinado pelo gate local completo, sem backups privados'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/verify-ci-plan.mjs
      - run: npm run build
      - run: npm run verify:public
      - run: npm run verify:reproducible
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.release == true && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Autorizar Somente com Gate Local Assinado
        env:
          RELEASE_EVIDENCE: ${{ inputs.evidence }}
        run: node scripts/verify-release-attestation.mjs --authorization-only
      - run: node scripts/build-public.mjs --production
      - run: node scripts/verify-public.mjs --production
      - name: Gate Obrigatorio da Etapa 10
        env:
          RELEASE_EVIDENCE: ${{ inputs.evidence }}
        run: node scripts/verify-release-attestation.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
